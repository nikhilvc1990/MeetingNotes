<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meeting Notes Detangler</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #f5f0e8;
    color: #2d3a3a;
    min-height: 100vh;
    padding: 24px 16px 48px;
  }

  .app { max-width: 760px; margin: 0 auto; }

  header {
    text-align: center;
    margin-bottom: 28px;
  }
  header h1 {
    font-size: 1.75rem;
    font-weight: 700;
    color: #1a5c5c;
    letter-spacing: -0.5px;
  }
  header p {
    margin-top: 6px;
    color: #5a7070;
    font-size: 0.95rem;
  }

  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,80,80,0.09);
    padding: 20px;
    margin-bottom: 20px;
  }

  label {
    display: block;
    font-weight: 600;
    color: #1a5c5c;
    margin-bottom: 8px;
    font-size: 0.9rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  textarea {
    width: 100%;
    height: 200px;
    border: 2px solid #c8dede;
    border-radius: 10px;
    padding: 14px;
    font-size: 0.95rem;
    font-family: inherit;
    color: #2d3a3a;
    background: #f9fcfc;
    resize: vertical;
    transition: border-color 0.2s;
    line-height: 1.55;
  }
  textarea:focus {
    outline: none;
    border-color: #2a9090;
    background: #fff;
  }
  textarea::placeholder { color: #9ab5b5; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 26px;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.18s;
  }
  .btn-primary {
    background: #1a8080;
    color: #fff;
    width: 100%;
    justify-content: center;
    margin-top: 14px;
    letter-spacing: 0.2px;
  }
  .btn-primary:hover { background: #156868; transform: translateY(-1px); box-shadow: 0 4px 14px rgba(26,128,128,0.25); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled { background: #80b8b8; cursor: not-allowed; transform: none; box-shadow: none; }

  .btn-copy {
    background: #eaf4f4;
    color: #1a5c5c;
    border: 1.5px solid #c8dede;
    font-size: 0.88rem;
    padding: 8px 16px;
  }
  .btn-copy:hover { background: #d4ecec; }

  /* Supervised badge */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #fff3cd;
    border: 1px solid #f0c040;
    color: #7a5a00;
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    margin-bottom: 18px;
  }
  .badge svg { flex-shrink: 0; }

  /* Result sections */
  .result-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 18px;
  }

  .section-title {
    font-size: 0.8rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.7px;
    color: #1a8080;
    margin-bottom: 10px;
  }

  .summary-card {
    background: linear-gradient(135deg, #e8f5f5, #f0fafa);
    border-left: 4px solid #1a8080;
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 20px;
    font-size: 0.97rem;
    line-height: 1.65;
    color: #1e3535;
  }

  /* Table */
  .table-wrap { overflow-x: auto; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
  }
  thead th {
    background: #1a8080;
    color: #fff;
    text-align: left;
    padding: 10px 12px;
    font-weight: 600;
    font-size: 0.82rem;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  thead th:first-child { border-radius: 8px 0 0 0; }
  thead th:last-child { border-radius: 0 8px 0 0; }
  tbody tr { border-bottom: 1px solid #eaf2f2; transition: background 0.12s; }
  tbody tr:hover { background: #f4fafa; }
  tbody td { padding: 10px 12px; vertical-align: top; color: #2d3a3a; }
  tbody td:first-child { font-weight: 500; }
  .due-badge {
    display: inline-block;
    background: #eaf4f4;
    color: #1a5c5c;
    border-radius: 6px;
    padding: 2px 8px;
    font-size: 0.82rem;
    font-weight: 600;
  }
  .no-data { color: #9ab5b5; font-style: italic; font-size: 0.9rem; }

  /* Lists */
  .tidy-list { list-style: none; }
  .tidy-list li {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid #f0f5f5;
    font-size: 0.93rem;
    line-height: 1.5;
  }
  .tidy-list li:last-child { border-bottom: none; }
  .tidy-list li::before {
    content: '';
    display: block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #1a8080;
    flex-shrink: 0;
    margin-top: 6px;
  }

  /* Two-col layout for decisions + questions */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 540px) { .two-col { grid-template-columns: 1fr; } }

  /* Loading spinner */
  .spinner {
    display: inline-block;
    width: 18px; height: 18px;
    border: 2.5px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Hint / error */
  .hint {
    text-align: center;
    color: #5a7070;
    padding: 18px;
    background: #f0fafa;
    border-radius: 10px;
    font-size: 0.93rem;
  }
  .hint strong { color: #1a8080; }

  .error-msg {
    color: #b84040;
    background: #fff0f0;
    border: 1px solid #f0c0c0;
    border-radius: 10px;
    padding: 14px;
    font-size: 0.9rem;
  }

  #results { display: none; }

  /* Copy toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #1a5c5c;
    color: #fff;
    padding: 10px 22px;
    border-radius: 30px;
    font-size: 0.9rem;
    font-weight: 600;
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    pointer-events: none;
    z-index: 999;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="app">

  <header>
    <h1>🗒️ Meeting Notes Detangler</h1>
    <p>Paste your raw meeting notes. Get a clean, structured summary in seconds.</p>
  </header>

  <!-- Input card -->
  <div class="card">
    <label for="notes-input">Paste your meeting notes</label>
    <textarea id="notes-input" placeholder="e.g.
— discussed q3 roadmap, sarah will own the landing page by july 15
— still unclear who handles the API integration
— decided to drop legacy support for IE11
— john to send the updated budget by eod friday..."></textarea>
    <button class="btn btn-primary" id="organize-btn" onclick="organizeNotes()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      Organize my notes
    </button>
  </div>

  <!-- Results card -->
  <div class="card" id="results">

    <div class="result-header">
      <div class="badge">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        Supervised AI — read it before you send it
      </div>
      <button class="btn btn-copy" id="copy-btn" onclick="copyAsEmail()">
        📋 Copy as email
      </button>
    </div>

    <div id="results-body"></div>
  </div>

</div>

<div class="toast" id="toast">✓ Copied to clipboard!</div>

<script>
let parsedData = null;

async function organizeNotes() {
  const notes = document.getElementById('notes-input').value.trim();
  const btn = document.getElementById('organize-btn');
  const resultsDiv = document.getElementById('results');
  const body = document.getElementById('results-body');

  if (!notes) {
    resultsDiv.style.display = 'block';
    body.innerHTML = `<div class="hint">✏️ <strong>Nothing to detangle yet!</strong><br>Paste some meeting notes above and click the button.</div>`;
    document.getElementById('copy-btn').style.display = 'none';
    return;
  }

  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span> Detangling…`;
  resultsDiv.style.display = 'none';
  parsedData = null;

  const prompt = `You are a meeting notes assistant. The user will give you raw meeting notes. Return ONLY a valid JSON object — no markdown, no code fences, no preamble. Use exactly these keys:

{
  "summary": "<2-sentence plain-English overview of the meeting>",
  "action_items": [
    { "task": "<task description>", "owner": "<person or team, or 'TBD'>", "due": "<deadline or 'TBD'>" }
  ],
  "decisions": ["<decision 1>", "<decision 2>"],
  "open_questions": ["<question 1>", "<question 2>"]
}

If a field has no items, return an empty array []. Do NOT include anything outside the JSON object.

Here are the meeting notes:
"""
${notes}
"""`;

  try {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        messages: [{ role: "user", content: prompt }]
      })
    });

    const data = await response.json();
    const raw = data.content.map(b => b.text || "").join("").trim();
    const cleaned = raw.replace(/```json|```/g, "").trim();
    parsedData = JSON.parse(cleaned);
    renderResults(parsedData);
    document.getElementById('copy-btn').style.display = 'inline-flex';
  } catch (err) {
    resultsDiv.style.display = 'block';
    body.innerHTML = `<div class="error-msg">⚠️ Something went wrong parsing the AI response. Please try again.<br><small style="opacity:.6">${err.message}</small></div>`;
    document.getElementById('copy-btn').style.display = 'none';
  } finally {
    btn.disabled = false;
    btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg> Organize my notes`;
  }
}

function renderResults(d) {
  const body = document.getElementById('results-body');
  const resultsDiv = document.getElementById('results');

  // Summary
  let html = `
    <div class="section-title">📝 Summary</div>
    <div class="summary-card">${esc(d.summary)}</div>
  `;

  // Action items
  html += `<div class="section-title" style="margin-top:6px">✅ Action Items</div>`;
  if (d.action_items && d.action_items.length) {
    html += `<div class="table-wrap"><table>
      <thead><tr><th>Task</th><th>Owner</th><th>Due</th></tr></thead>
      <tbody>`;
    d.action_items.forEach(a => {
      html += `<tr>
        <td>${esc(a.task)}</td>
        <td>${esc(a.owner || 'TBD')}</td>
        <td><span class="due-badge">${esc(a.due || 'TBD')}</span></td>
      </tr>`;
    });
    html += `</tbody></table></div>`;
  } else {
    html += `<p class="no-data">No action items identified.</p>`;
  }

  // Two-column: Decisions + Open Questions
  html += `<div class="two-col" style="margin-top:20px">`;

  html += `<div>
    <div class="section-title">🟢 Decisions Made</div>`;
  if (d.decisions && d.decisions.length) {
    html += `<ul class="tidy-list">${d.decisions.map(dec => `<li>${esc(dec)}</li>`).join('')}</ul>`;
  } else {
    html += `<p class="no-data">No decisions recorded.</p>`;
  }
  html += `</div>`;

  html += `<div>
    <div class="section-title">❓ Open Questions</div>`;
  if (d.open_questions && d.open_questions.length) {
    html += `<ul class="tidy-list">${d.open_questions.map(q => `<li>${esc(q)}</li>`).join('')}</ul>`;
  } else {
    html += `<p class="no-data">No open questions noted.</p>`;
  }
  html += `</div>`;

  html += `</div>`;

  body.innerHTML = html;
  resultsDiv.style.display = 'block';
  resultsDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function esc(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function copyAsEmail() {
  if (!parsedData) return;
  const d = parsedData;
  let text = `MEETING SUMMARY\n${'='.repeat(40)}\n\n`;
  text += `${d.summary}\n\n`;

  if (d.action_items && d.action_items.length) {
    text += `ACTION ITEMS\n${'-'.repeat(30)}\n`;
    d.action_items.forEach(a => {
      text += `• ${a.task} — Owner: ${a.owner || 'TBD'} | Due: ${a.due || 'TBD'}\n`;
    });
    text += '\n';
  }

  if (d.decisions && d.decisions.length) {
    text += `DECISIONS MADE\n${'-'.repeat(30)}\n`;
    d.decisions.forEach(dec => { text += `• ${dec}\n`; });
    text += '\n';
  }

  if (d.open_questions && d.open_questions.length) {
    text += `OPEN QUESTIONS\n${'-'.repeat(30)}\n`;
    d.open_questions.forEach(q => { text += `• ${q}\n`; });
    text += '\n';
  }

  // Fallback copy method that works inside iframes
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
  } catch (err) {
    alert('Could not auto-copy. Here is your summary — please copy it manually:\n\n' + text);
  }
}
</script>
</body>
</html>
